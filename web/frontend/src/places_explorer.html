<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripCraft - Top Places Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .card-enter {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        .card-enter-active {
            opacity: 1;
            transform: translateY(0);
        }
        .star-filled {
            color: #f59e0b; /* Amber 500 */
        }
        .type-tag {
            background-color: #e5e7eb; /* Gray 200 */
            color: #4b5563; /* Gray 600 */
            font-size: 0.75rem;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            text-transform: capitalize;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <header class="bg-white/80 backdrop-blur-md fixed top-0 left-0 right-0 z-50 border-b border-gray-200">
        <div class="container mx-auto px-4 sm:px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="text-2xl font-bold text-gray-800">
                    <a href="home_UI.html" class="hover:text-violet-600 transition"><i class="fas fa-paper-plane mr-2 text-violet-600"></i>TripCraft</a>
                </div>
                <nav class="hidden md:flex items-center space-x-8">
                    <a href="home_UI.html#features" class="text-gray-600 hover:text-violet-600 transition">Features</a>
                    <a href="#" class="text-violet-600 hover:text-violet-600 transition font-bold">Places</a>
                    <a href="trip_plan_UI.html" class="text-gray-600 hover:text-violet-600 transition">AI Planner</a>
                    <a href="group_trip.html" class="text-gray-600 hover:text-violet-600 transition">Group Planner</a>
                    <a href="expense_Ui.html" class="text-gray-600 hover:text-violet-600 transition">Expense Management</a>
                    <a href="home_UI.html#pricing" class="text-gray-600 hover:text-violet-600 transition">Pricing</a>
                    <a href="home_UI.html#contact" class="text-gray-600 hover:text-violet-600 transition">Contact</a>
                </nav>
                <div class="flex items-center space-x-4">
                    <button class="hidden sm:block text-gray-600 font-medium hover:text-violet-600 transition">Log In</button>
                    <button class="bg-violet-600 text-white px-5 py-2 rounded-full hover:bg-violet-700 transition shadow-lg shadow-violet-600/20 font-semibold">Sign Up</button>
                </div>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12 mt-20">
        <header class="text-center mb-8 md:mb-12">
            <h1 class="text-3xl md:text-5xl font-bold text-gray-900 tracking-tight">Top Places Explorer</h1>
            <p class="mt-2 md:mt-4 text-base md:text-lg text-gray-600 max-w-2xl mx-auto">Discover the best-rated destinations around the globe, just a search away.</p>
            
            <div class="mt-6 md:mt-8 max-w-xl mx-auto">
                <div class="relative flex items-center">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <input 
                        id="searchInput"
                        type="text"
                        placeholder="Search for places like 'Eiffel Tower' or 'Kyoto'..."
                        class="w-full pl-12 pr-4 py-3 bg-white border border-gray-300 rounded-full shadow-sm focus:ring-2 focus:ring-violet-500 focus:border-violet-500 transition-shadow duration-200"
                    >
                </div>
            </div>
        </header>

        <main id="placesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 md:gap-8">
            </main>

        <div id="noResults" class="hidden text-center py-16">
            <h2 class="text-2xl font-semibold text-gray-700">No Places Found</h2>
            <p class="mt-2 text-gray-500">Try adjusting your search query.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Mock data for places using the new structure
            const places = [
                {
                    "id": "ChIJd-tZsWCq3oAR_sO70namuLg",
                    "types": ["amusement_park", "tourist_attraction", "point_of_interest"],
                    "rating": 4.4,
                    "websiteUri": "https://seaworld.com/san-diego/",
                    "displayName": { "text": "SeaWorld San Diego" },
                    "generativeSummary": { "overview": { "text": "Ocean park featuring sea life shows, animal encounters, thrill rides and a playground." } },
                    "thumbnailUrl": "https://lh5.googleusercontent.com/p/AF1QipM5aC3vnoS24sY2So-5IuI08_lO23oW3G5p0BQ=w408-h272-k-no"
                },
                {
                    "id": "ChIJN1t_tDeuEmsRUsoyG83frY4",
                    "types": ["zoo", "tourist_attraction", "park"],
                    "rating": 4.6,
                    "websiteUri": "https://www.sandiegozoo.org",
                    "displayName": { "text": "San Diego Zoo" },
                    "generativeSummary": { "overview": { "text": "World-renowned zoo with over 3,500 animals of more than 650 species and subspecies." } },
                    "thumbnailUrl": "https://lh5.googleusercontent.com/p/AF1QipOMi_X0f_16pBmr-pYy_fQj2qS_wJkF3iE4bQk=w408-h271-k-no"
                },
                {
                    "id": "ChIJAx8sPU-uEmsR_8_f-Yn5EaY",
                    "types": ["museum", "tourist_attraction"],
                    "rating": 4.7,
                    "websiteUri": "https://www.midway.org/",
                    "displayName": { "text": "USS Midway Museum" },
                    "generativeSummary": { "overview": { "text": "Historical naval aircraft carrier museum with a collection of restored aircraft." } },
                    "thumbnailUrl": "https://lh5.googleusercontent.com/p/AF1QipNqY5v8L5i-cZkY_3t5iG3g-pX_4hOq_tJ8aXg=w408-h306-k-no"
                },
                {
                    "id": "ChIJ7-L5dPOuEmsR7F4j-A8Lg6E",
                    "types": ["park", "garden", "point_of_interest"],
                    "rating": 4.8,
                    "websiteUri": "https://www.balboapark.org/",
                    "displayName": { "text": "Balboa Park" },
                    "generativeSummary": { "overview": { "text": "A 1,200-acre historic urban cultural park in San Diego, California." } },
                    "thumbnailUrl": "https://lh5.googleusercontent.com/p/AF1QipMLX68vWd3A-v8tV3qA0aF_tJ8aXg_tJ8aXg_tJ8aXg=w408-h272-k-no"
                },
                {
                    "id": "ChIJy5b0gQ-uEmsRe2QoA8Lg6E",
                    "types": ["neighborhood", "tourist_attraction"],
                    "rating": 4.5,
                    "websiteUri": "https://www.gaslamp.org/",
                    "displayName": { "text": "Gaslamp Quarter" },
                    "generativeSummary": { "overview": { "text": "A lively downtown neighborhood, known for its nightlife and Victorian architecture." } },
                    "thumbnailUrl": "https://lh5.googleusercontent.com/p/AF1QipP_Z6e8q_Z_Z_Z_Z_Z_Z_Z_Z_Z_Z_Z_Z_Z_Z_Z_Z_Z_Z_Z_Z=w408-h272-k-no"
                },
                {
                    "id": "ChIJc8Gz_PyuEmsR0-tL-A8Lg6E",
                    "types": ["beach", "park"],
                    "rating": 4.8,
                    "websiteUri": "https://www.sandiego.gov/lifeguards/beaches/la-jolla",
                    "displayName": { "text": "La Jolla Cove" },
                    "generativeSummary": { "overview": { "text": "Small, picturesque cove and beach that is surrounded by cliffs." } },
                    "thumbnailUrl": "https://lh5.googleusercontent.com/p/AF1QipN-z-t_7t_7t_7t_7t_7t_7t_7t_7t_7t_7t_7t_7t_7t_7t_7t=w408-h272-k-no"
                }
            ];

            const placesGrid = document.getElementById('placesGrid');
            const searchInput = document.getElementById('searchInput');
            const noResultsMessage = document.getElementById('noResults');

            // --- Function to generate star rating HTML ---
            function generateStars(rating) {
                let starsHTML = '';
                const fullStars = Math.floor(rating);
                const halfStar = rating % 1 >= 0.5;
                const emptyStars = 5 - fullStars - (halfStar ? 1 : 0);

                for (let i = 0; i < fullStars; i++) {
                    starsHTML += `<svg class="w-5 h-5 star-filled" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
                }
                
                if (halfStar) {
                    starsHTML += `<svg class="w-5 h-5 star-filled" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
                }

                for (let i = 0; i < emptyStars; i++) {
                    starsHTML += `<svg class="w-5 h-5 text-gray-300" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
                }

                return starsHTML;
            }

            // --- Function to render place cards ---
            function renderPlaces(placeArray) {
                placesGrid.innerHTML = ''; // Clear existing cards
                if (placeArray.length === 0) {
                    noResultsMessage.classList.remove('hidden');
                } else {
                    noResultsMessage.classList.add('hidden');
                }

                placeArray.forEach((place, index) => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl shadow-lg overflow-hidden flex flex-col transform hover:-translate-y-1 hover:shadow-2xl transition-all duration-300 ease-in-out card-enter';
                    
                    const placeTypes = (place.types || []).slice(0, 2).map(type => `<span class="type-tag">${type.replace(/_/g, ' ')}</span>`).join('');

                    card.innerHTML = `
                        <div class="relative h-56">
                            <img class="w-full h-full object-cover" src="${place.thumbnailUrl || 'https://placehold.co/600x400/e2e8f0/4a5568?text=Image+Not+Available'}" alt="${place.displayName.text}" onerror="this.onerror=null;this.src='https://placehold.co/600x400/e2e8f0/4a5568?text=Image+Error';">
                            <div class="absolute top-0 right-0 flex space-x-2 m-3">
                                <span class="bg-violet-600 text-white px-3 py-1 rounded-full text-sm font-semibold">${place.rating ? place.rating.toFixed(1) : 'N/A'}</span>
                            </div>
                        </div>
                        <div class="p-5 flex-grow flex flex-col">
                            <h3 class="text-xl font-bold text-gray-900 truncate">${place.displayName.text}</h3>
                            <p class="text-gray-600 mt-1 text-sm flex-grow">${place.generativeSummary?.overview?.text || 'No description available.'}</p>
                            <div class="flex items-center mt-3">${generateStars(place.rating || 0)}</div>
                            <div class="flex items-center gap-2 mt-4 flex-wrap">${placeTypes}</div>
                        </div>
                        <div class="p-5 pt-0">
                             ${place.websiteUri ? `<a href="${place.websiteUri}" target="_blank" rel="noopener noreferrer" class="block w-full text-center bg-violet-600 text-white font-semibold rounded-lg px-4 py-2 hover:bg-violet-700 transition-colors duration-200">Visit Website</a>` : ''}
                        </div>
                    `;
                    placesGrid.appendChild(card);
                    
                    // Trigger the fade-in animation with a slight delay
                    setTimeout(() => {
                        card.classList.add('card-enter-active');
                    }, 100 * (index % 4));
                });
            }

            // --- Function to filter places ---
            function filterPlaces() {
                const query = searchInput.value.toLowerCase();
                const filteredPlaces = places.filter(place => {
                    const nameMatch = place.displayName.text.toLowerCase().includes(query);
                    const typeMatch = (place.types || []).some(type => type.replace(/_/g, ' ').toLowerCase().includes(query));
                    const summaryMatch = (place.generativeSummary?.overview?.text || '').toLowerCase().includes(query);
                    return nameMatch || typeMatch || summaryMatch;
                });
                renderPlaces(filteredPlaces);
            }

            // --- Event Listeners ---
            searchInput.addEventListener('keyup', filterPlaces);

            // --- Initial Render ---
            renderPlaces(places);
        });
    </script>
</body>
</html>
